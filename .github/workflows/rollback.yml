name: Rollback

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Stable git tag or commit to roll back to
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate rollback inputs
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -eu
          test -n "$TARGET_REF" || { echo "target_ref is required"; exit 1; }
          test -n "$SSH_HOST" || { echo "SSH_HOST is required"; exit 1; }
          test -n "$SSH_USER" || { echo "SSH_USER is required"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "DEPLOY_PATH is required"; exit 1; }
          echo "TARGET_REF=$TARGET_REF"
          echo "SSH_HOST=$SSH_HOST"
          echo "SSH_USER=$SSH_USER"
          echo "DEPLOY_PATH=$DEPLOY_PATH"

      - name: Roll back on server
        uses: appleboy/ssh-action@v1.2.2
        env:
          TARGET_REF: ${{ inputs.target_ref }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: TARGET_REF,DEPLOY_PATH
          script_stop: true
          script: |
            set -eu
            echo "Rolling back to ref: $TARGET_REF"
            echo "Deploy path: $DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            git fetch origin --tags --prune
            git checkout --detach "$TARGET_REF"
            docker compose build app
            docker compose up -d app

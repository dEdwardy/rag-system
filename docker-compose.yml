services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-system:latest
    restart: unless-stopped
    init: true
    env_file:
      - ./apps/api/.env
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      API_PORT: 3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:http').get('http://127.0.0.1:8080/', res => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
